[package]
name = "sweeflow"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
env_logger = "0.11.11"
ffmpeg-next = "9"
hex = "0.4.3"
log = "0.4.34"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "std"] }
png = "0.18.1"
quinn = "0.11"
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
smithay-client-toolkit = "0.21"
tokio = { version = "1.53.1", features = ["full"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
zbus = "5"
zvariant = "5.15"
