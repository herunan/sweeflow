[package]
name = "sweeflow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Mac apps as windows on a Linux desktop"

[dependencies]
libc = "0.2"
anyhow = "1.0.104"
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
env_logger = "0.11.11"
# FFmpeg's C API (decode.rs), only the parts in use: decoding, filters (scale_vaapi) and swscale; no
# libavformat, libavdevice or libswresample to link.
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec", "avfilter", "swscale"] }
hex = "0.4.3"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
log = "0.4.34"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "std"] }
mdns-sd = "0.21.5"
png = "0.18.1"
quinn = "0.11"
rcgen = "0.14.10"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility", "unstable-winit-030"] }
smithay-client-toolkit = "0.21"
tokio = { version = "1.53.1", features = ["full"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
x25519-dalek = { version = "2", default-features = false }
# The X11 frontend (x11ui.rs, x11gl.rs): X itself, and EGL + OpenGL ES for the video (libEGL and
# libX11 are loaded at run time, so nothing more is needed to build).
x11rb = { version = "0.13.2", features = ["cursor", "randr", "render", "shape", "xfixes", "xinput", "xkb", "xtest"] }
glow = "0.18"
libloading = "0.8"
zbus = "5"
# Measures the menu font (tray.rs: lining up the keys at the end of the tray menu rows).
ttf-parser = "0.25"
zvariant = "5.15"

[features]
# The release build (release/build.sh): FFmpeg linked statically from release/ffmpeg.sh's /opt/ffmpeg, so one
# binary runs on every distro whatever FFmpeg it has.
portable = ["ffmpeg-sys-next/static"]

# The Debian package (build-deb.sh, cargo-deb). Only what every user shares goes in it: the binary,
# the licences, a launcher and the icon. The per-user side (systemd user unit, autostart entry, tray
# icons, Plasma widget, shortcuts) is written by `sweeflow install` (or the first `sweeflow open`, which
# this launcher runs), and runs /usr/bin/sweeflow itself, so the package's upgrades reach it (see
# setup::installed_binary).
#
# depends = "$auto": cargo-deb runs dpkg-shlibdeps on the binary, so the FFmpeg package names
# (libavcodec61 on Debian 13, libavcodec60 on Ubuntu 24.04, ...) are the ones of the system the .deb
# is built on. FFmpeg's sonames differ between releases, so one .deb is built per target release, on that
# release (a container is enough), and the release uploads the one for the newest Ubuntu/Debian under
# sweeflow_amd64.deb. Nothing is listed by hand: a hand-written list would go stale.
[package.metadata.deb]
name = "sweeflow"
maintainer = "Hernán Romero <herunan@users.noreply.github.com>"
copyright = "2026, Hernán Romero"
license-file = ["../LICENSE", "0"]
section = "net"
priority = "optional"
# What it links (FFmpeg and the rest, worked out), and systemd, which runs it as a user service.
depends = "$auto, systemd"
# Programs it runs: the Mac's sound plays through pw-cat (PipeWire) or pacat (PulseAudio), and its
# notifications go through notify-send. Tools of a particular desktop (hyprctl, KDE's, gsettings)
# come with that desktop.
recommends = "pipewire-bin | pulseaudio-utils, libnotify-bin"
extended-description = """\
Shows the apps of a Mac as windows on this Linux desktop, over the network.
Open Sweeflow from the app menu (or run `sweeflow install`) once as your user: \
it starts with your desktop from then on, and offers to link a Mac."""
assets = [
    ["target/release/sweeflow", "usr/bin/sweeflow", "755"],
    ["target/THIRD-PARTY-LICENSES.html", "usr/share/doc/sweeflow/THIRD-PARTY-LICENSES.html", "644"],
    ["packaging/sweeflow.desktop", "usr/share/applications/sweeflow.desktop", "644"],
    ["../assets/sweeflow-app.svg", "usr/share/icons/hicolor/scalable/apps/sweeflow.svg", "644"],
]

# sctk-adwaita with two small changes (see vendor/sctk-adwaita/SWEEFLOW.md): a double click on the title bar
# doesn't maximise Sweeflow's fixed-size windows on GNOME.
[patch.crates-io]
sctk-adwaita = { path = "vendor/sctk-adwaita" }
