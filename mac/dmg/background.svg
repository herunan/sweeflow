<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460">
  <!-- The installer window's background (dmgbuild, see settings.py). Finder puts Sweeflow.app at
       (170, 150) and Applications at (470, 150), 112 pt icons, labels below them: the violet is a
       mid tone, so the labels read in black (light mode) and white (dark mode) alike. The steps
       cover opening an app that isn't notarised (macOS 15 and later: Open Anyway in Settings).
       Taller than what's drawn (460, content within 420): Finder takes its title bar out of the
       window's height, and the steps were cut off at the bottom.
       Rendered to background.png and background@2x.png by make-background.sh. -->
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="640" height="460" fill="url(#stage)"/>

  <!-- Confetti, clear of the icons, their names and the steps. -->
  <g>
    <rect x="34" y="30" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(24 38 36)"/>
    <rect x="600" y="34" width="8" height="12" rx="2" fill="#f472b6" transform="rotate(-24 604 40)"/>
    <rect x="300" y="40" width="7" height="11" rx="2" fill="#34d399" transform="rotate(40 303 45)"/>
    <rect x="606" y="190" width="6" height="10" rx="2" fill="#ffffff" opacity="0.8" transform="rotate(12 609 195)"/>
    <rect x="28" y="196" width="6" height="10" rx="2" fill="#34d399" transform="rotate(-12 31 201)"/>
    <circle cx="250" cy="58" r="3" fill="#fde68a"/>
    <circle cx="398" cy="50" r="2.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="96" cy="70" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="548" cy="78" r="2.5" fill="#fde68a"/>
  </g>

  <!-- The arrow from Sweeflow to Applications. -->
  <g filter="url(#glow)" opacity="0.75">
    <path d="M240 146 C 268 72, 350 68, 398 124" fill="none" stroke="#f0abfc" stroke-width="12" stroke-linecap="round"/>
  </g>
  <path d="M240 146 C 268 72, 350 68, 398 124" fill="none" stroke="url(#arrow)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 387.6 130.3 L 411.0 139.2 L 405.8 114.7 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

  <!-- The steps: drag, then macOS's one-time check (Sweeflow isn't notarised yet). -->
  <rect x="32" y="258" width="576" height="134" rx="16" fill="#1e0b4b" fill-opacity="0.35"/>
  <g font-family="Fira Sans" fill="#ffffff">
    <g>
      <circle cx="62" cy="290" r="11" fill="#ffffff"/>
      <text x="62" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">1</text>
      <text x="84" y="295" font-size="15" font-weight="600">Drag Sweeflow into Applications</text>
    </g>
    <g>
      <circle cx="62" cy="325" r="11" fill="#ffffff"/>
      <text x="62" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">2</text>
      <text x="84" y="330" font-size="15" font-weight="600">Open it. If macOS shows a warning, choose Done</text>
    </g>
    <g>
      <circle cx="62" cy="360" r="11" fill="#ffffff"/>
      <text x="62" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">3</text>
      <text x="84" y="365" font-size="15" font-weight="600">System Settings › Privacy &amp; Security › Open Anyway</text>
    </g>
  </g>
</svg>
